name: CI

on:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, format, test, build
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run build
        env:
          API_URL: ${{ secrets.API_URL }}
          SITE_URL: ${{ secrets.SITE_URL }}

  docker:
    name: Build the production image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: >
          docker build
          --build-arg API_URL="$API_URL"
          --build-arg SITE_URL="$SITE_URL"
          --build-arg HOME_QUOTE_ID="$HOME_QUOTE_ID"
          --build-arg READ_ONLY="$READ_ONLY"
          .
        env:
          API_URL: ${{ secrets.API_URL }}
          SITE_URL: ${{ secrets.SITE_URL }}
          HOME_QUOTE_ID: ${{ secrets.HOME_QUOTE_ID }}
          READ_ONLY: ${{ secrets.READ_ONLY }}
